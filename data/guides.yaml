# case_type 룩업 키: "{domain}.{case_type}"
# 스코프: 교통 도메인 전용. 추가 시 파트 C 책임.
# 주의: 단계와 항목은 일반 정보이며, 변호사 검수 전 확정 답변 아님.

traffic.accident_settlement:
  - step: 1
    title: 사고 직후 조치
    items:
      - 부상자 구호 및 119 신고 (인적 피해 시 필수)
      - 경찰 신고 (인사사고·뺑소니·도주 시 필수)
      - 사고 현장 사진·블랙박스 영상 확보
      - 상대방 인적사항·차량번호·보험사 확인
    note: 현장 이탈 시 뺑소니 의심 받을 수 있음.
  - step: 2
    title: 보험 접수
    items:
      - 본인 보험사에 사고 접수
      - 상대 보험사 정보 확보
      - 진단서·치료비 영수증 모으기
  - step: 3
    title: 과실비율 협의
    items:
      - 보험사 과실비율 산정 결과 확인
      - 이의 있으면 손해보험협회 분쟁심의위원회 청구
    note: 과실비율 분쟁심의위원회는 무료, 90일 내 결정.
  - step: 4
    title: 합의금 산정·합의서 작성
    items:
      - 치료비·위자료·일실수익 산정
      - 합의서에 향후 추가 청구 포기 조항 신중히 검토
    note: 후유증 가능성 있으면 합의 보류 또는 일부 합의.
  - step: 5
    title: 분쟁 시 대응
    items:
      - 금융감독원 분쟁조정
      - 민사 손해배상 청구 소송

traffic.accident_injury:
  - step: 1
    title: 응급조치 및 신고
    items:
      - 부상자 구호 (의무, 위반 시 도주 인정 가능)
      - 112·119 신고
      - 경찰 출동·교통사고 사실확인원 발급 요청
    note: 사망·중상 시 형사 처벌 대상이 될 수 있음.
  - step: 2
    title: 형사 절차 대응
    items:
      - 12대 중과실 해당 여부 확인 (신호위반·중앙선·과속 등)
      - 종합보험 가입 여부, 피해자 합의 여부 확인
      - 변호인 선임 검토
    note: 교통사고처리 특례법 제3조 단서 해당 시 형사 처벌.
  - step: 3
    title: 피해자 합의
    items:
      - 진단서 등 피해 입증
      - 치료비·일실수익·위자료 산정
      - 형사합의서 작성 (양형 반영)
  - step: 4
    title: 민사·행정 절차
    items:
      - 보험금 청구 (자배책·종합보험)
      - 민사 손해배상 소송
      - 운전면허 행정처분 대응

traffic.dui:
  - step: 1
    title: 측정 및 단속 단계
    items:
      - 호흡측정 결과 확인
      - 불복 시 채혈측정 요구 가능
    note: 측정 거부는 가중처벌. 신중히 결정.
  - step: 2
    title: 행정처분 (면허)
    items:
      - 0.03~0.08%: 면허정지 100일
      - 0.08% 이상: 면허취소
      - 이의신청 (도로교통공단), 행정심판·행정소송 가능
  - step: 3
    title: 형사 절차
    items:
      - 검찰 송치 → 약식기소 또는 정식재판
      - 단순 음주, 인사사고 동반, 재범 여부에 따라 양형 차이
      - 변호인 선임 강력 권장
    note: 윤창호법 적용 시 가중처벌.
  - step: 4
    title: 양형 자료 준비
    items:
      - 반성문, 음주운전 방지장치 부착 동의
      - 가족·직장 탄원서
      - 알코올 치료 프로그램 이수 증명

traffic.hit_and_run:
  - step: 1
    title: 자수 검토
    items:
      - 가능한 빨리 경찰서·변호인과 자수 절차 협의
    note: 자수는 양형에 유리. 다만 본인 단독 결정보다 변호인 상담 후 진행 권장.
  - step: 2
    title: 피해자 구호·합의
    items:
      - 피해자 상태 확인 후 구호 조치
      - 형사합의서 작성 (가중처벌 회피 핵심)
  - step: 3
    title: 형사 변론
    items:
      - 특정범죄 가중처벌법 제5조의3 적용 여부 검토
      - 도주 의사 부재 등 항변 사유 검토
    note: 사망·중상 도주는 무기 또는 5년 이상 징역. 즉시 변호인 선임.
